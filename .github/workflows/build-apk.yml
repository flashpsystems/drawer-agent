name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses & install SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashDrawerAgent-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the APK onto an orphan branch so it can be fetched over git
      # (the Actions artifact store is not reachable from the build session).
      - name: Publish APK to apk-out branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/drawer-agent.apk
          cd "$RUNNER_TEMP"
          rm -rf pub && mkdir pub && cd pub
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b apk-out
          cp /tmp/drawer-agent.apk drawer-agent.apk
          echo "APK built from $GITHUB_SHA on $(date -u)" > BUILD_INFO.txt
          git add drawer-agent.apk BUILD_INFO.txt
          git commit -q -m "APK build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-out
